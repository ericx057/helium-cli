[package]
name = "hel"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Control Helium tabs from your terminal on macOS"
repository = "https://github.com/ericx057/helium-cli"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

[profile.release]
strip = true
lto = true

[[bench]]
name = "search"
harness = false

